<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Andamento dei titoli in portafoglio e filtri interattivi per il grafico.">
    <title>Tracker Titoli — Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('tracker-theme') === 'light'
                ? 'light'
                : 'dark';
        } catch (error) {
            console.error('Impossibile leggere il tema salvato:', error);
        }
    </script>
    <style>
        :root {
            color-scheme: dark;
            --page: #080c14;
            --surface: rgba(15, 23, 42, .82);
            --surface-raised: #0b1220;
            --border: rgba(51, 65, 85, .72);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --faint: #64748b;
            --accent: #38bdf8;
            --positive: #34d399;
            --negative: #fb7185;
        }

        :root[data-theme="light"] {
            color-scheme: light;
            --page: #f1f5f9;
            --surface: rgba(255, 255, 255, .92);
            --surface-raised: #f8fafc;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --faint: #94a3b8;
            --accent: #0284c7;
            --positive: #059669;
            --negative: #e11d48;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(ellipse at 75% -10%, rgba(37, 99, 235, .13), transparent 36rem),
                var(--page);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button, select { font: inherit; }
        button { color: inherit; }

        .app-header {
            position: sticky;
            top: 0;
            z-index: 5;
            border-bottom: 1px solid var(--border);
            background: color-mix(in srgb, var(--page) 88%, transparent);
            backdrop-filter: blur(16px);
        }

        .header-inner, main {
            width: min(1540px, calc(100% - 48px));
            margin: 0 auto;
        }

        .header-inner {
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .brand, .header-actions, .portfolio-control, .chart-toolbar,
        .toolbar-group, .asset-main, .asset-metrics {
            display: flex;
            align-items: center;
        }

        .brand { gap: 9px; min-width: 0; }

        .brand-mark {
            width: 34px;
            height: 34px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border: 1px solid rgba(56, 189, 248, .35);
            border-radius: 12px;
            background: linear-gradient(145deg, rgba(8, 145, 178, .24), rgba(37, 99, 235, .2));
            color: var(--accent);
        }

        .brand-mark svg { width: 18px; height: 18px; }
        .brand-title { margin: 0; color: var(--text); font-size: 14px; font-weight: 700; letter-spacing: -.02em; }
        .brand-caption { margin: 2px 0 0; color: var(--muted); font-size: 10px; }
        .header-actions { gap: 8px; }

        .portfolio-control {
            gap: 9px;
            height: 34px;
            min-width: 0;
            padding: 0 8px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-raised);
        }

        .portfolio-control svg { width: 16px; height: 16px; flex: 0 0 auto; color: var(--accent); }
        .control-copy { min-width: 0; display: flex; align-items: center; gap: 8px; }
        .control-label { flex: 0 0 auto; color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .1em; white-space: nowrap; }

        select {
            width: 200px;
            max-width: 30vw;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
        }

        select option { background: var(--page); color: var(--text); }

        .icon-button, .toolbar-button, .range-button {
            border: 1px solid var(--border);
            background: var(--surface-raised);
            cursor: pointer;
            transition: border-color .16s ease, color .16s ease, background .16s ease;
        }

        .icon-button {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            color: var(--muted);
        }

        .icon-button:hover, .toolbar-button:hover, .range-button:hover:not(:disabled) {
            border-color: rgba(56, 189, 248, .5);
            color: var(--text);
        }

        .icon-button svg { width: 17px; height: 17px; }

        main { padding: 26px 0 42px; }
        .panel {
            border: 1px solid var(--border);
            border-radius: 15px;
            background: var(--surface);
            box-shadow: 0 14px 36px rgba(0, 0, 0, .1);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.75fr) minmax(330px, .9fr);
            align-items: stretch;
            gap: 18px;
        }

        .panel { min-width: 0; padding: 19px; }
        .chart-panel, .assets-panel { min-height: 620px; display: flex; flex-direction: column; }
        .section-description { margin: 5px 0 0; color: var(--muted); font-size: 10px; line-height: 1.5; }

        .count-badge {
            flex: 0 0 auto;
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface-raised);
            color: var(--muted);
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 10px;
        }

        .chart-toolbar { flex-wrap: wrap; justify-content: space-between; gap: 10px; padding: 4px 0 8px; }
        .toolbar-group { flex-wrap: wrap; gap: 5px; }
        .chart-display-controls { display: flex; align-items: center; gap: 10px; }

        .range-button, .mode-button, .fullscreen-button {
            min-height: 30px;
            padding: 0 10px;
            border-radius: 8px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 600;
        }

        .range-button {
            border: 1px solid var(--border);
            background: var(--surface-raised);
            cursor: pointer;
            transition: border-color .16s ease, color .16s ease, background .16s ease;
        }

        .range-button[aria-pressed="true"] {
            border-color: rgba(56, 189, 248, .35);
            background: rgba(8, 145, 178, .17);
            color: var(--accent);
        }

        .mode-switch { display: flex; align-items: center; }

        .mode-button {
            min-height: 30px;
            padding: 0 10px;
            border: 1px solid var(--border);
            background: var(--surface-raised);
            color: var(--muted);
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
            transition: border-color .16s ease, color .16s ease, background .16s ease;
        }

        .mode-button:first-child { border-radius: 8px 0 0 8px; }
        .mode-button + .mode-button { margin-left: -1px; border-radius: 0 8px 8px 0; }

        .mode-button[aria-pressed="true"] {
            position: relative;
            z-index: 1;
            border-color: rgba(56, 189, 248, .35);
            background: #1e293b;
            color: #22d3ee;
        }

        :root[data-theme="light"] .mode-button[aria-pressed="true"] {
            background: #e2e8f0;
            color: #0284c7;
        }

        .fullscreen-button {
            width: 30px;
            height: 30px;
            min-height: 30px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface-raised);
            color: var(--muted);
            cursor: pointer;
            transition: border-color .16s ease, color .16s ease, background .16s ease;
        }

        .fullscreen-button:hover {
            border-color: rgba(56, 189, 248, .5);
            color: var(--accent);
        }

        .fullscreen-button svg { width: 16px; height: 16px; }
        .fullscreen-button .fullscreen-exit-icon { display: none; }
        .fullscreen-button[aria-pressed="true"] .fullscreen-enter-icon { display: none; }
        .fullscreen-button[aria-pressed="true"] .fullscreen-exit-icon { display: block; }
        .chart-panel:fullscreen {
            width: 100%;
            height: 100%;
            min-height: 0;
            overflow: auto;
            border-radius: 0;
            background: var(--page);
        }

        button:focus-visible, select:focus-visible, .asset-row:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        button:disabled { cursor: not-allowed; opacity: .48; }

        .chart-caption {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            min-height: 30px;
            margin-bottom: 4px;
            color: var(--muted);
            font-size: 10px;
        }

        #active-series { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 6px; }

        .series-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 7px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--surface-raised);
            color: var(--text);
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 9px;
        }

        .series-dot { width: 7px; height: 7px; border-radius: 50%; }
        .series-variation { font-weight: 700; }

        .chart-wrap {
            position: relative;
            flex: 1;
            min-height: 380px;
            padding: 13px 10px 8px;
            border: 1px solid var(--border);
            border-radius: 11px;
            background: color-mix(in srgb, var(--surface-raised) 72%, transparent);
        }

        .chart-empty {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
            pointer-events: none;
        }

        .chart-empty[hidden] { display: none; }
        #price-chart { width: 100% !important; height: 100% !important; }

        .dividend-tooltip {
            position: absolute;
            z-index: 3;
            padding: 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface-raised);
            box-shadow: 0 8px 22px rgba(0, 0, 0, .22);
            color: var(--text);
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 9px;
            line-height: 1.4;
            white-space: nowrap;
            pointer-events: none;
        }

        .dividend-tooltip[hidden] { display: none; }
        .dividend-tooltip-date { display: block; margin-bottom: 6px; }
        .dividend-tooltip-value { display: flex; align-items: center; gap: 8px; }
        .dividend-tooltip-dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; }

        .assets-panel { padding: 0; overflow: hidden; }
        .assets-subheading {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 82px 64px;
            column-gap: 8px;
            padding: 5px 12px 5px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .sort-button {
            min-width: 0;
            padding: 3px 0;
            border: 0;
            background: transparent;
            color: var(--faint);
            cursor: pointer;
            font-size: inherit;
            font-weight: inherit;
            letter-spacing: inherit;
            text-align: left;
            text-transform: inherit;
            white-space: nowrap;
        }

        .sort-button:hover, .sort-button[aria-sort="ascending"], .sort-button[aria-sort="descending"] {
            color: var(--accent);
        }

        .sort-button[data-sort="price"], .sort-button[data-sort="variation"] { text-align: right; }
        .sort-indicator { display: inline-block; margin-left: 2px; }

        #asset-list { flex: 1; overflow: auto; }

        .asset-row {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 82px 64px;
            grid-template-rows: auto auto;
            column-gap: 8px;
            row-gap: 3px;
            align-items: center;
            padding: 6px 12px 6px 14px;
            border: 0;
            border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
            border-left: 2px solid transparent;
            background: transparent;
            text-align: left;
            cursor: pointer;
            transition: background .16s ease, border-color .16s ease;
        }

        .asset-row:hover { background: color-mix(in srgb, var(--surface-raised) 82%, transparent); }
        .asset-row.is-active { border-left-color: var(--asset-color, var(--accent)); background: color-mix(in srgb, var(--asset-color, var(--accent)) 9%, transparent); }
        .asset-row:disabled { cursor: default; opacity: .55; }
        .asset-main { display: contents; }
        .asset-identity { min-width: 0; display: flex; align-items: center; gap: 9px; }
        .asset-text { min-width: 0; display: flex; align-items: baseline; gap: 8px; }
        .asset-identity { grid-column: 1; grid-row: 1; }

        .asset-dot {
            width: 8px;
            height: 8px;
            flex: 0 0 auto;
            border: 1px solid var(--asset-color, var(--faint));
            border-radius: 50%;
            background: var(--asset-color, transparent);
        }

        .asset-ticker { flex: 0 0 auto; color: var(--text); font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 700; }
        .asset-description { min-width: 0; max-width: 190px; overflow: hidden; color: var(--muted); font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
        .asset-price, .asset-variation { color: var(--text); font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; font-weight: 600; text-align: right; white-space: nowrap; }
        .asset-price { grid-column: 2; grid-row: 1; }
        .asset-variation { grid-column: 3; grid-row: 1; }
        .asset-metrics { grid-column: 1 / -1; grid-row: 2; margin-left: 17px; color: var(--faint); font-family: "SFMono-Regular", Consolas, monospace; font-size: 9px; line-height: 1.2; }

        .variation-positive { color: var(--positive) !important; }
        .variation-negative { color: var(--negative) !important; }
        .load-status {
            margin: 12px 0 0;
            padding: 10px 12px;
            border: 1px solid rgba(251, 113, 133, .3);
            border-radius: 9px;
            background: rgba(190, 24, 93, .1);
            color: var(--negative);
            font-size: 11px;
        }

        .load-status[hidden] { display: none; }

        @media (max-width: 900px) {
            .dashboard-grid { grid-template-columns: minmax(0, 1fr); }
            .chart-panel, .assets-panel { min-height: 0; }
            .assets-panel { max-height: 580px; }
            #asset-list { min-height: 280px; }
        }

        @media (max-width: 600px) {
            .header-inner, main { width: min(100% - 28px, 1540px); }
            .header-inner { min-height: 54px; gap: 8px; }
            .brand-caption { display: none; }
            .brand-mark { width: 32px; height: 32px; }
            .brand-title { font-size: 13px; }
            .header-actions { gap: 6px; }
            .portfolio-control { max-width: 185px; padding: 0 7px; gap: 6px; }
            .portfolio-control svg { display: none; }
            .control-copy { gap: 5px; }
            .control-label { font-size: 8px; letter-spacing: .06em; }
            select { width: 105px; max-width: 32vw; }
            select { font-size: 10px; }
            .icon-button { width: 34px; height: 34px; }
            main { padding-top: 18px; }
            .panel { padding: 14px; }
            .assets-panel { padding: 0; }
            .chart-wrap { min-height: 300px; padding: 8px 4px; }
        }

        @media (max-width: 480px) {
            .portfolio-control { max-width: 160px; }
            .control-label { font-size: 7px; }
            select { width: 85px; max-width: 27vw; font-size: 9px; }
            .assets-subheading, .asset-row {
                grid-template-columns: minmax(0, 1fr) 68px 54px;
                column-gap: 5px;
            }

            .asset-row { padding-right: 8px; padding-left: 10px; }
            .asset-identity { gap: 6px; }
            .asset-text { gap: 5px; }
            .asset-ticker { font-size: 10px; }
            .asset-description { font-size: 8px; }
            .asset-price, .asset-variation { font-size: 9px; }
        }

        @media (min-width: 901px) {
            .header-inner { height: 58px; min-height: 58px; }
            main {
                height: calc(100vh - 59px);
                min-height: 0;
                display: flex;
                flex-direction: column;
                padding: 16px 0;
            }

            .dashboard-grid { flex: 1; min-height: 0; }
            .chart-panel, .assets-panel { height: 100%; min-height: 0; }
            .chart-wrap { min-height: 0; }
            #asset-list { min-height: 0; }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M3 17l6-6 4 4 8-9M15 6h6v6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="brand-title">Tracker Titoli</h1>
                    <p class="brand-caption">Panoramica del portafoglio</p>
                </div>
            </div>
            <div class="header-actions">
                <label class="portfolio-control" for="portfolio-select">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                        <path d="M3 7a2 2 0 012-2h5l2 2h7a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" stroke-width="1.7" stroke-linejoin="round"></path>
                    </svg>
                    <span class="control-copy">
                        <span class="control-label">Portafoglio attivo</span>
                        <select id="portfolio-select" aria-label="Seleziona portafoglio" disabled>
                            <option value="">Caricamento…</option>
                        </select>
                    </span>
                </label>
                <button id="theme-toggle" class="icon-button" type="button" aria-label="Attiva tema chiaro" title="Cambia tema">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                        <circle cx="12" cy="12" r="4" stroke-width="1.8"></circle>
                        <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3l1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3l1.42-1.42" stroke-width="1.8" stroke-linecap="round"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="dashboard-grid">
            <section class="panel chart-panel" aria-label="Grafico storico dei titoli">
                <div class="chart-toolbar">
                    <div class="toolbar-group" role="group" aria-label="Intervallo del grafico">
                        <button class="range-button" type="button" data-range="1m" aria-pressed="false" disabled>1M</button>
                        <button class="range-button" type="button" data-range="1y" aria-pressed="false" disabled>1A</button>
                        <button class="range-button" type="button" data-range="ytd" aria-pressed="false" disabled>YTD</button>
                        <button class="range-button" type="button" data-range="all" aria-pressed="true" disabled>Tutto</button>
                    </div>
                    <div class="chart-display-controls">
                        <div class="mode-switch" role="group" aria-label="Modalità di visualizzazione">
                            <button id="chart-mode-absolute" class="mode-button" type="button" aria-pressed="true" disabled>Prezzo (€)</button>
                            <button id="chart-mode-percentage" class="mode-button" type="button" aria-pressed="false" disabled>Percentuale (%)</button>
                        </div>
                        <button id="toggle-chart-fullscreen" class="fullscreen-button" type="button"
                            aria-label="Visualizza il grafico a schermo intero" title="Schermo intero" aria-pressed="false">
                            <svg class="fullscreen-enter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3M8 8 4 4m12 4 4-4M8 16l-4 4m12-4 4 4"
                                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                            <svg class="fullscreen-exit-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                                <path d="m3 3 6 6m0-6v6H3m18-6-6 6m0-6v6h6M3 21l6-6m0 6v-6H3m18 6-6-6m0 6v-6h6"
                                    stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="chart-caption">
                    <div id="active-series" aria-label="Titoli visualizzati"></div>
                </div>
                <div class="chart-wrap">
                    <canvas id="price-chart" role="img" aria-label="Grafico storico dei prezzi"></canvas>
                    <div id="chart-empty" class="chart-empty">Seleziona almeno un titolo dall'elenco per visualizzare il grafico.</div>
                    <div id="dividend-tooltip" class="dividend-tooltip" role="tooltip" hidden></div>
                </div>
                <p id="load-status" class="load-status" role="status" aria-live="polite" hidden></p>
            </section>

            <section class="panel assets-panel" aria-label="Titoli del portafoglio">
                <div class="assets-subheading" role="row">
                    <button class="sort-button" type="button" data-sort="ticker" aria-sort="ascending">Ticker<span class="sort-indicator" aria-hidden="true">↑</span></button>
                    <button class="sort-button" type="button" data-sort="price" aria-sort="none">Prezzo<span class="sort-indicator" aria-hidden="true"></span></button>
                    <button class="sort-button" type="button" data-sort="variation" aria-sort="none">Var. %<span class="sort-indicator" aria-hidden="true"></span></button>
                </div>
                <div id="asset-list" aria-label="Titoli nel portafoglio">
                    <p class="section-description" style="padding:18px">Caricamento dei dati…</p>
                </div>
            </section>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://wbwwjwfhgvrwtoaitleh.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_mMYcQfDTg7ziPFS_Nrb5PA_4I8KVBet';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const seriesColors = [
            '#38bdf8', '#a78bfa', '#34d399', '#fb7185', '#fbbf24', '#2dd4bf',
            '#818cf8', '#f472b6', '#a3e635', '#fb923c', '#22d3ee', '#c084fc'
        ];

        let chartInstance = null;
        let portfolioRequestId = 0;
        let activePortfolioId = '';
        let summaries = [];
        let selectedTickers = new Set();
        let selectedRange = 'all';
        let percentageMode = false;
        let summarySort = { key: 'ticker', direction: 'asc' };

        const numberFormat = new Intl.NumberFormat('it-IT', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
        function isDarkTheme() {
            return document.documentElement.dataset.theme === 'dark';
        }

        function showLoadError(message) {
            const status = document.getElementById('load-status');
            status.textContent = message;
            status.hidden = !message;
        }

        function getSeriesRange(chart = chartInstance) {
            if (!chart) return null;
            const visible = chart.data.datasets
                .filter((dataset, index) => chart.isDatasetVisible(index))
                .flatMap(dataset => dataset.rawData
                    .map((value, index) => value === null ? -1 : index)
                    .filter(index => index >= 0));
            if (visible.length === 0) return null;
            return { min: Math.min(...visible), max: Math.max(...visible) };
        }

        function getRangeForSelection(range) {
            const visibleRange = getSeriesRange();
            if (!visibleRange) return null;
            if (range === 'all') return visibleRange;

            const labels = chartInstance.data.labels;
            const lastDate = new Date(`${labels[visibleRange.max]}T00:00:00Z`);
            let startDate;
            if (range === '1m') {
                startDate = new Date(lastDate);
                startDate.setUTCDate(startDate.getUTCDate() - 29);
            } else if (range === '1y') {
                startDate = new Date(lastDate);
                startDate.setUTCDate(startDate.getUTCDate() - 364);
            } else {
                startDate = new Date(Date.UTC(lastDate.getUTCFullYear(), 0, 1));
            }

            const startLabel = startDate.toISOString().slice(0, 10);
            const firstIndex = labels.findIndex((date, index) =>
                index >= visibleRange.min && index <= visibleRange.max && date >= startLabel
            );
            return {
                min: firstIndex < 0 ? visibleRange.min : firstIndex,
                max: visibleRange.max
            };
        }

        function setChartRange(range) {
            if (!chartInstance) return;
            const visibleRange = getRangeForSelection(range);
            if (!visibleRange) return;
            document.getElementById('dividend-tooltip').hidden = true;
            selectedRange = range;
            chartInstance.resetZoom();
            chartInstance.options.scales.x.min = visibleRange.min;
            chartInstance.options.scales.x.max = visibleRange.max;
            updatePercentageDatasets();
            chartInstance.update('none');
            updateRangeButtons();
            updateChartCaption();
        }

        function updateRangeButtons() {
            document.querySelectorAll('[data-range]').forEach(button => {
                button.setAttribute('aria-pressed', String(button.dataset.range === selectedRange));
                button.disabled = !chartInstance;
            });
        }

        function updatePercentageDatasets() {
            if (!chartInstance) return;
            const start = Math.max(0, Math.floor(chartInstance.scales.x.min ?? 0));
            const end = Math.min(
                chartInstance.data.labels.length - 1,
                Math.ceil(chartInstance.scales.x.max ?? chartInstance.data.labels.length - 1)
            );

            chartInstance.data.datasets.forEach(dataset => {
                if (!percentageMode) {
                    dataset.data = dataset.rawData;
                    return;
                }

                let basePrice = null;
                for (let index = start; index <= end; index++) {
                    if (dataset.rawData[index] !== null) {
                        basePrice = dataset.rawData[index];
                        break;
                    }
                }
                dataset.data = dataset.rawData.map(price =>
                    price === null || basePrice === null || basePrice === 0
                        ? null
                        : ((price - basePrice) / basePrice) * 100
                );
            });
        }

        function updateChartCaption() {
            const visible = [...selectedTickers];
            document.getElementById('chart-empty').hidden = visible.length > 0;

            const activeSeries = document.getElementById('active-series');
            activeSeries.replaceChildren();
            if (!chartInstance) return;

            const firstIndex = Math.max(0, Math.ceil(chartInstance.scales.x.min));
            const lastIndex = Math.min(
                chartInstance.data.labels.length - 1,
                Math.floor(chartInstance.scales.x.max)
            );
            visible.forEach(ticker => {
                const datasetIndex = chartInstance.data.datasets.findIndex(item => item.label === ticker);
                if (datasetIndex < 0 || !chartInstance.isDatasetVisible(datasetIndex)) return;
                const dataset = chartInstance.data.datasets[datasetIndex];
                const chip = document.createElement('span');
                chip.className = 'series-chip';
                const dot = document.createElement('span');
                dot.className = 'series-dot';
                dot.style.backgroundColor = dataset.borderColor;
                const label = document.createElement('span');
                label.textContent = ticker;
                const prices = dataset.data;
                let firstPrice = null;
                let lastPrice = null;
                let visiblePriceCount = 0;
                for (let index = firstIndex; index <= lastIndex; index++) {
                    const price = prices[index];
                    if (Number.isFinite(price)) {
                        visiblePriceCount += 1;
                        if (firstPrice === null) firstPrice = price;
                        lastPrice = price;
                    }
                }

                const variation = document.createElement('span');
                variation.className = 'series-variation';
                if (visiblePriceCount < 2 || firstPrice === null || lastPrice === null
                    || (!percentageMode && firstPrice === 0)) {
                    variation.textContent = '—';
                    variation.style.color = 'var(--muted)';
                } else {
                    const change = percentageMode
                        ? lastPrice
                        : ((lastPrice - firstPrice) / firstPrice) * 100;
                    const sign = change >= 0 ? '+' : '';
                    variation.textContent = `${sign}${numberFormat.format(change)}%`;
                    variation.style.color = change > 0
                        ? 'var(--positive)'
                        : change < 0 ? 'var(--negative)' : 'var(--muted)';
                }

                chip.setAttribute('aria-label', `${ticker}: variazione nel periodo ${variation.textContent}`);
                chip.append(dot, label, variation);
                activeSeries.appendChild(chip);
            });
        }

        function updateChartTheme() {
            if (!chartInstance) return;
            const textColor = isDarkTheme() ? '#cbd5e1' : '#475569';
            chartInstance.options.plugins.legend.labels.color = textColor;
            chartInstance.options.scales.x.ticks.color = textColor;
            chartInstance.options.scales.y.ticks.color = textColor;
            chartInstance.options.scales.y.grid.color = isDarkTheme()
                ? 'rgba(100, 116, 139, .2)'
                : 'rgba(148, 163, 184, .25)';
            chartInstance.update('none');
        }

        function getSummaries(records, quantities) {
            const byTicker = new Map();
            records.forEach(record => {
                if (!byTicker.has(record.ticker)) byTicker.set(record.ticker, []);
                byTicker.get(record.ticker).push(record);
            });

            return [...quantities.entries()]
                .map(([ticker, quantity]) => {
                    const tickerRecords = (byTicker.get(ticker) || [])
                        .slice()
                        .sort((a, b) => b.date.localeCompare(a.date));
                    const latest = tickerRecords[0];
                    const previous = tickerRecords[1];
                    const price = latest ? Number(latest.price) : null;
                    const previousPrice = previous ? Number(previous.price) : null;
                    const variation = Number.isFinite(price) && Number.isFinite(previousPrice)
                        && previousPrice !== 0
                        ? ((price - previousPrice) / previousPrice) * 100
                        : null;

                    return {
                        ticker,
                        description: latest?.description || '',
                        quantity,
                        price: Number.isFinite(price) ? price : null,
                        variation
                    };
                })
                .sort((a, b) => a.ticker.localeCompare(b.ticker, 'it'));
        }

        function renderAssetList() {
            const list = document.getElementById('asset-list');
            list.replaceChildren();
            const sortedSummaries = [...summaries].sort((a, b) => {
                const left = a[summarySort.key];
                const right = b[summarySort.key];
                if (left === null || right === null) {
                    if (left === right) return 0;
                    return left === null ? 1 : -1;
                }
                const comparison = summarySort.key === 'ticker'
                    ? String(left).localeCompare(String(right), 'it')
                    : left - right;
                return comparison * (summarySort.direction === 'asc' ? 1 : -1);
            });
            sortedSummaries.forEach(summary => {
                const originalIndex = summaries.findIndex(item => item.ticker === summary.ticker);
                const color = seriesColors[originalIndex % seriesColors.length];
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'asset-row';
                button.dataset.ticker = summary.ticker;
                button.style.setProperty('--asset-color', color);
                button.disabled = !Number.isFinite(summary.price);
                button.setAttribute('aria-pressed', String(selectedTickers.has(summary.ticker)));
                button.setAttribute('aria-label',
                    `${summary.ticker}, ${summary.description || 'nessuna descrizione'}, ${Number.isFinite(summary.price) ? `${numberFormat.format(summary.price)} euro` : 'nessun prezzo'}, ${selectedTickers.has(summary.ticker) ? 'visibile nel grafico' : 'non visibile nel grafico'}`);
                if (selectedTickers.has(summary.ticker)) button.classList.add('is-active');

                const main = document.createElement('span');
                main.className = 'asset-main';
                const identity = document.createElement('span');
                identity.className = 'asset-identity';
                const dot = document.createElement('span');
                dot.className = 'asset-dot';
                const text = document.createElement('span');
                text.className = 'asset-text';
                const ticker = document.createElement('span');
                ticker.className = 'asset-ticker';
                ticker.textContent = summary.ticker;
                const description = document.createElement('span');
                description.className = 'asset-description';
                description.textContent = summary.description || 'Descrizione non disponibile';
                text.append(ticker, description);
                identity.append(dot, text);

                const price = document.createElement('span');
                price.className = 'asset-price';
                price.textContent = Number.isFinite(summary.price)
                    ? `${numberFormat.format(summary.price)} €`
                    : '—';
                const variation = document.createElement('span');
                variation.className = 'asset-variation';
                if (summary.variation === null) {
                    variation.textContent = '—';
                } else {
                    variation.textContent = `${summary.variation > 0 ? '+' : ''}${numberFormat.format(summary.variation)}%`;
                    if (summary.variation > 0) variation.classList.add('variation-positive');
                    if (summary.variation < 0) variation.classList.add('variation-negative');
                }
                main.append(identity, price);

                const metrics = document.createElement('span');
                metrics.className = 'asset-metrics';
                const quantity = document.createElement('span');
                quantity.textContent = `Quantità ${new Intl.NumberFormat('it-IT', { maximumFractionDigits: 8 }).format(summary.quantity)}`;
                metrics.append(quantity);
                button.append(main, variation, metrics);
                button.addEventListener('click', () => toggleTicker(summary.ticker));
                list.appendChild(button);
            });
        }

        document.querySelectorAll('[data-sort]').forEach(button => {
            button.addEventListener('click', () => {
                const key = button.dataset.sort;
                summarySort = {
                    key,
                    direction: summarySort.key === key && summarySort.direction === 'asc' ? 'desc' : 'asc'
                };
                document.querySelectorAll('[data-sort]').forEach(sortButton => {
                    const active = sortButton.dataset.sort === key;
                    const direction = active ? summarySort.direction : null;
                    sortButton.setAttribute('aria-sort',
                        direction === 'asc' ? 'ascending' : direction === 'desc' ? 'descending' : 'none');
                    sortButton.querySelector('.sort-indicator').textContent =
                        direction === 'asc' ? '↑' : direction === 'desc' ? '↓' : '';
                });
                renderAssetList();
            });
        });

        function toggleTicker(ticker) {
            if (!chartInstance) return;
            document.getElementById('dividend-tooltip').hidden = true;
            const datasetIndex = chartInstance.data.datasets.findIndex(dataset => dataset.label === ticker);
            if (datasetIndex < 0) return;

            if (selectedTickers.has(ticker)) {
                selectedTickers.delete(ticker);
                chartInstance.setDatasetVisibility(datasetIndex, false);
            } else {
                selectedTickers.add(ticker);
                chartInstance.setDatasetVisibility(datasetIndex, true);
            }

            renderAssetList();
            if (selectedRange === 'all') {
                const range = getSeriesRange();
                if (range) {
                    chartInstance.options.scales.x.min = range.min;
                    chartInstance.options.scales.x.max = range.max;
                }
            }
            updatePercentageDatasets();
            chartInstance.update('none');
            updateChartCaption();
        }

        function renderChart(records, dividends = []) {
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }
            const dividendTooltip = document.getElementById('dividend-tooltip');
            dividendTooltip.hidden = true;
            dividendTooltip.replaceChildren();

            const chartTickers = [...new Set(records.map(record => record.ticker))].sort((a, b) => a.localeCompare(b, 'it'));
            if (chartTickers.length === 0) {
                selectedTickers = new Set();
                renderAssetList();
                document.getElementById('chart-empty').hidden = false;
                document.querySelectorAll('[data-range], .mode-button').forEach(button => { button.disabled = true; });
                updateChartCaption();
                return;
            }

            const recordedDates = [...new Set(records.map(record => record.date))].sort();
            const dates = [];
            const currentDate = new Date(`${recordedDates[0]}T00:00:00Z`);
            const lastDate = new Date(`${recordedDates[recordedDates.length - 1]}T00:00:00Z`);
            while (currentDate <= lastDate) {
                dates.push(currentDate.toISOString().slice(0, 10));
                currentDate.setUTCDate(currentDate.getUTCDate() + 1);
            }
            const pricesByTicker = new Map(chartTickers.map(ticker => [ticker, new Map()]));
            records.forEach(record => pricesByTicker.get(record.ticker).set(record.date, Number(record.price)));

            const datasets = chartTickers.map((ticker, index) => {
                const data = dates.map(date => pricesByTicker.get(ticker).get(date) ?? null);
                const summaryIndex = summaries.findIndex(summary => summary.ticker === ticker);
                const color = seriesColors[(summaryIndex < 0 ? index : summaryIndex) % seriesColors.length];
                return {
                    label: ticker,
                    data,
                    rawData: data,
                    hidden: !selectedTickers.has(ticker),
                    spanGaps: true,
                    borderColor: color,
                    backgroundColor: color,
                    borderWidth: 1.25,
                    pointRadius: 0,
                    pointHitRadius: 10,
                    pointHoverRadius: 4,
                    tension: .18
                };
            });

            const datasetIndexesByTicker = new Map(
                datasets.map((dataset, index) => [dataset.label, index])
            );
            const dividendEvents = dividends
                .map(dividend => ({
                    ...dividend,
                    amount: Number(dividend.amount),
                    dateIndex: dates.indexOf(dividend.date)
                }))
                .filter(dividend => dividend.dateIndex >= 0);
            const markerRadius = 7;
            let hoveredDividend = null;
            const hideDividendTooltip = () => {
                if (dividendTooltip.hidden) return false;
                dividendTooltip.hidden = true;
                hoveredDividend = null;
                return true;
            };
            const dividendMarkerPlugin = {
                id: 'dividendMarkers',
                afterDatasetsDraw: chart => {
                    const { ctx, chartArea, scales } = chart;
                    ctx.save();
                    dividendEvents.forEach(dividend => {
                        const datasetIndex = datasetIndexesByTicker.get(dividend.ticker);
                        if (datasetIndex === undefined || !chart.isDatasetVisible(datasetIndex)
                            || dividend.dateIndex < scales.x.min
                            || dividend.dateIndex > scales.x.max) {
                            return;
                        }

                        const x = scales.x.getPixelForValue(dividend.dateIndex);
                        if (x < chartArea.left || x > chartArea.right) return;
                        const y = chartArea.bottom - markerRadius - 2;
                        ctx.beginPath();
                        ctx.arc(x, y, markerRadius, 0, Math.PI * 2);
                        ctx.fillStyle = chart.data.datasets[datasetIndex].borderColor;
                        ctx.fill();
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 9px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('D', x, y);
                    });
                    ctx.restore();
                },
                afterEvent: (chart, args) => {
                    const { event } = args;
                    if (event.type === 'mouseout') {
                        if (hideDividendTooltip()) args.changed = true;
                        return;
                    }

                    const { chartArea, scales } = chart;
                    let match = null;
                    if (event.x >= chartArea.left && event.x <= chartArea.right
                        && event.y >= chartArea.top && event.y <= chartArea.bottom) {
                        match = dividendEvents.find(dividend => {
                            const datasetIndex = datasetIndexesByTicker.get(dividend.ticker);
                            if (datasetIndex === undefined || !chart.isDatasetVisible(datasetIndex)
                                || dividend.dateIndex < scales.x.min
                                || dividend.dateIndex > scales.x.max) {
                                return false;
                            }
                            const x = scales.x.getPixelForValue(dividend.dateIndex);
                            const y = chartArea.bottom - markerRadius - 2;
                            return Math.hypot(event.x - x, event.y - y) <= markerRadius + 5;
                        }) || null;
                    }

                    if (!match) {
                        if (hideDividendTooltip()) args.changed = true;
                        return;
                    }
                    if (hoveredDividend === match) return;

                    hoveredDividend = match;
                    const dateLine = document.createElement('span');
                    dateLine.className = 'dividend-tooltip-date';
                    dateLine.textContent = match.date;
                    const valueLine = document.createElement('div');
                    valueLine.className = 'dividend-tooltip-value';
                    const colorDot = document.createElement('span');
                    colorDot.className = 'dividend-tooltip-dot';
                    colorDot.style.backgroundColor =
                        chart.data.datasets[datasetIndexesByTicker.get(match.ticker)].borderColor;
                    const amountLine = document.createElement('span');
                    amountLine.textContent = `${match.ticker}: ${numberFormat.format(match.amount)} €`;
                    valueLine.append(colorDot, amountLine);
                    dividendTooltip.replaceChildren(dateLine, valueLine);
                    dividendTooltip.hidden = false;

                    const container = chart.canvas.parentElement;
                    const canvasRect = chart.canvas.getBoundingClientRect();
                    const containerRect = container.getBoundingClientRect();
                    const scaleX = canvasRect.width / chart.width;
                    const scaleY = canvasRect.height / chart.height;
                    const pointerX = canvasRect.left - containerRect.left - container.clientLeft
                        + event.x * scaleX;
                    const pointerY = canvasRect.top - containerRect.top - container.clientTop
                        + event.y * scaleY;
                    const left = Math.min(
                        pointerX + 10,
                        container.clientWidth - dividendTooltip.offsetWidth - 8
                    );
                    dividendTooltip.style.left = `${Math.max(8, left)}px`;
                    dividendTooltip.style.top = `${
                        Math.max(0, pointerY - dividendTooltip.offsetHeight - 8)
                    }px`;
                    args.changed = true;
                }
            };

            const textColor = isDarkTheme() ? '#cbd5e1' : '#475569';
            chartInstance = new Chart(document.getElementById('price-chart'), {
                type: 'line',
                data: { labels: dates, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: { mode: 'nearest', intersect: false, axis: 'x' },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: isDarkTheme() ? '#0b1220' : '#fff',
                            titleColor: textColor,
                            bodyColor: textColor,
                            titleFont: { family: '"SFMono-Regular", Consolas, monospace', size: 9 },
                            bodyFont: { family: '"SFMono-Regular", Consolas, monospace', size: 9 },
                            usePointStyle: true,
                            pointStyle: 'circle',
                            boxWidth: 6,
                            boxHeight: 7,
                            boxPadding: 8,
                            borderColor: isDarkTheme() ? '#334155' : '#e2e8f0',
                            borderWidth: 1,
                            callbacks: {
                                label: context => {
                                    const dataPoints = context.chart.tooltip?.dataPoints;
                                    const tooltipItems = dataPoints?.length ? dataPoints : [context];
                                    const labels = tooltipItems.map(item => String(item.dataset.label));
                                    const values = tooltipItems.map(item =>
                                        `${numberFormat.format(item.parsed.y)}${percentageMode ? '%' : ' €'}`);
                                    const labelWidth = Math.max(...labels.map(label => label.length));
                                    const valueWidth = Math.max(...values.map(value => value.length));
                                    const itemIndex = tooltipItems.findIndex(item =>
                                        item.datasetIndex === context.datasetIndex);
                                    const label = labels[itemIndex < 0 ? 0 : itemIndex];
                                    const value = values[itemIndex < 0 ? 0 : itemIndex];

                                    return `${label.padEnd(labelWidth)}: ${value.padStart(valueWidth)}`;
                                }
                            }
                        },
                        zoom: {
                            pan: {
                                enabled: true,
                                mode: 'x',
                                modifierKey: null,
                                onPan: ({ chart }) => {
                                    selectedRange = null;
                                    updatePercentageDatasets();
                                    chart.update('none');
                                    updateChartCaption();
                                    updateRangeButtons();
                                }
                            },
                            zoom: {
                                wheel: { enabled: true },
                                pinch: { enabled: true },
                                mode: 'x',
                                onZoom: ({ chart }) => {
                                    selectedRange = null;
                                    updatePercentageDatasets();
                                    chart.update('none');
                                    updateChartCaption();
                                    updateRangeButtons();
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'category',
                            grid: { display: false },
                            ticks: {
                                color: textColor,
                                font: { family: '"SFMono-Regular", Consolas, monospace', size: 9 },
                                maxTicksLimit: 8,
                                maxRotation: 0,
                                callback(value) {
                                    const label = this.getLabelForValue(value);
                                    return label ? new Intl.DateTimeFormat('it-IT', {
                                        month: 'short',
                                        year: '2-digit',
                                        timeZone: 'UTC'
                                    }).format(new Date(`${label}T00:00:00Z`)) : '';
                                }
                            }
                        },
                        y: {
                            grid: { color: isDarkTheme() ? 'rgba(100, 116, 139, .2)' : 'rgba(148, 163, 184, .25)' },
                            ticks: {
                                color: textColor,
                                font: { family: '"SFMono-Regular", Consolas, monospace', size: 9 },
                                callback: value => percentageMode
                                    ? `${Number(value).toLocaleString('it-IT', { maximumFractionDigits: 1 })}%`
                                    : `${Number(value).toLocaleString('it-IT', { maximumFractionDigits: 2 })} €`
                            }
                        }
                    }
                },
                plugins: [dividendMarkerPlugin]
            });

            renderAssetList();
            const visibleRange = getSeriesRange();
            if (visibleRange) {
                chartInstance.options.scales.x.min = visibleRange.min;
                chartInstance.options.scales.x.max = visibleRange.max;
            }
            updateRangeButtons();
            setChartRange('all');
            document.querySelectorAll('.mode-button').forEach(button => { button.disabled = false; });
        }

        async function fetchPagedPrices(tickers) {
            const allPrices = [];
            const pageSize = 1000;
            let page = 0;

            while (true) {
                const from = page * pageSize;
                const { data, error } = await supabaseClient
                    .from('prices')
                    .select('date, ticker, price')
                    .in('ticker', tickers)
                    .order('ticker', { ascending: true })
                    .order('date', { ascending: false })
                    .range(from, from + pageSize - 1);
                if (error) {
                    console.error('Errore nel recupero dei prezzi del portafoglio:', error);
                    return null;
                }
                allPrices.push(...data);
                if (data.length < pageSize) return allPrices;
                page += 1;
            }
        }

        async function fetchPagedDividends(tickers) {
            const allDividends = [];
            const pageSize = 1000;
            let page = 0;

            while (true) {
                const from = page * pageSize;
                const { data, error } = await supabaseClient
                    .from('dividends')
                    .select('date, ticker, amount')
                    .in('ticker', tickers)
                    .order('date', { ascending: false })
                    .order('ticker', { ascending: true })
                    .range(from, from + pageSize - 1);

                if (error) {
                    console.error('Errore nel recupero dei dividendi del portafoglio:', error);
                    return null;
                }

                allDividends.push(...data);
                if (data.length < pageSize) return allDividends;
                page += 1;
            }
        }

        async function handlePortfolioChange(portfolioId) {
            if (!portfolioId) return;
            const requestId = ++portfolioRequestId;
            showLoadError('');
            document.getElementById('asset-list').replaceChildren();
            document.getElementById('asset-list').textContent = 'Caricamento dei dati…';

            const allPositions = [];
            const pageSize = 1000;
            let page = 0;
            while (true) {
                const from = page * pageSize;
                const { data, error } = await supabaseClient
                    .from('portfolio_positions')
                    .select('ticker, quantity')
                    .eq('portfolio_id', portfolioId)
                    .order('ticker', { ascending: true })
                    .range(from, from + pageSize - 1);

                if (error) {
                    if (requestId !== portfolioRequestId) return;
                    console.error('Errore nel recupero delle posizioni del portafoglio:', error);
                    showLoadError('Errore nel caricamento delle posizioni del portafoglio.');
                    document.getElementById('portfolio-select').value = activePortfolioId || portfolioId;
                    return;
                }
                if (requestId !== portfolioRequestId) return;
                allPositions.push(...data);
                if (data.length < pageSize) break;
                page += 1;
            }

            const quantities = new Map(allPositions.map(position =>
                [position.ticker, Number(position.quantity)]
            ));

            if (quantities.size === 0) {
                activePortfolioId = portfolioId;
                summaries = [];
                selectedTickers = new Set();
                renderChart([]);
                document.getElementById('asset-list').textContent = 'Nessuna posizione in questo portafoglio.';
                return;
            }

            const prices = await fetchPagedPrices([...quantities.keys()]);
            if (requestId !== portfolioRequestId) return;
            if (prices === null) {
                showLoadError('Errore nel caricamento dei prezzi del portafoglio.');
                document.getElementById('portfolio-select').value = activePortfolioId || portfolioId;
                return;
            }

            const dividends = await fetchPagedDividends([...quantities.keys()]);
            if (requestId !== portfolioRequestId) return;
            if (dividends === null) {
                showLoadError('Errore nel caricamento dei dividendi del portafoglio.');
                document.getElementById('portfolio-select').value = activePortfolioId || portfolioId;
                return;
            }

            const { data: instruments, error: instrumentsError } = await supabaseClient
                .from('instruments')
                .select('ticker, description')
                .in('ticker', [...quantities.keys()]);
            if (requestId !== portfolioRequestId) return;
            if (instrumentsError) {
                console.error('Errore nel recupero delle descrizioni:', instrumentsError);
                showLoadError('Errore nel caricamento delle descrizioni dei titoli.');
                document.getElementById('portfolio-select').value = activePortfolioId || portfolioId;
                return;
            }

            const descriptions = new Map(instruments.map(instrument =>
                [instrument.ticker, instrument.description || '']
            ));
            activePortfolioId = portfolioId;
            const records = prices.map(record => ({
                ...record,
                price: Number(record.price),
                description: descriptions.get(record.ticker) || ''
            }));
            summaries = getSummaries(records, quantities);
            selectedTickers = new Set();
            const firstTickerWithPrices = summaries.find(summary => Number.isFinite(summary.price));
            if (firstTickerWithPrices) selectedTickers.add(firstTickerWithPrices.ticker);
            renderChart(records, dividends);
        }

        async function fetchInitialData() {
            const { data: portfolios, error } = await supabaseClient
                .from('portfolios')
                .select('id, name')
                .order('name', { ascending: true });

            if (error) {
                console.error('Errore nel recupero dei portafogli:', error);
                showLoadError('Errore nel caricamento dei portafogli.');
                document.getElementById('asset-list').textContent = 'Impossibile caricare i portafogli.';
                return;
            }

            const select = document.getElementById('portfolio-select');
            select.replaceChildren();
            if (portfolios.length === 0) {
                select.disabled = true;
                showLoadError('Non ci sono portafogli nel database. Creane uno per visualizzare i titoli.');
                document.getElementById('asset-list').textContent = 'Nessun portafoglio disponibile.';
                return;
            }

            portfolios.forEach(portfolio => {
                const option = document.createElement('option');
                option.value = String(portfolio.id);
                option.textContent = portfolio.name;
                select.appendChild(option);
            });
            select.disabled = false;
            select.addEventListener('change', event => handlePortfolioChange(event.target.value));
            select.value = String(portfolios[0].id);
            await handlePortfolioChange(select.value);
        }

        document.querySelectorAll('[data-range]').forEach(button => {
            button.addEventListener('click', () => setChartRange(button.dataset.range));
        });

        function setPercentageMode(enabled) {
            percentageMode = enabled;
            document.getElementById('chart-mode-absolute')
                .setAttribute('aria-pressed', String(!percentageMode));
            document.getElementById('chart-mode-percentage')
                .setAttribute('aria-pressed', String(percentageMode));
            updatePercentageDatasets();
            if (chartInstance) {
                chartInstance.update('none');
                updateChartCaption();
            }
        }

        document.getElementById('chart-mode-absolute')
            .addEventListener('click', () => setPercentageMode(false));
        document.getElementById('chart-mode-percentage')
            .addEventListener('click', () => setPercentageMode(true));

        const chartPanel = document.querySelector('.chart-panel');
        const fullscreenButton = document.getElementById('toggle-chart-fullscreen');
        fullscreenButton.addEventListener('click', async () => {
            try {
                if (document.fullscreenElement === chartPanel) {
                    await document.exitFullscreen();
                } else {
                    await chartPanel.requestFullscreen();
                }
            } catch (error) {
                console.error('Impossibile modificare la modalità a schermo intero:', error);
                const status = document.getElementById('load-status');
                status.textContent = 'Non è stato possibile modificare la modalità a schermo intero.';
                status.hidden = false;
            }
        });

        document.addEventListener('fullscreenchange', () => {
            const isFullscreen = document.fullscreenElement === chartPanel;
            fullscreenButton.setAttribute('aria-pressed', String(isFullscreen));
            fullscreenButton.setAttribute(
                'aria-label',
                isFullscreen ? 'Esci da schermo intero' : 'Visualizza il grafico a schermo intero'
            );
            fullscreenButton.title = isFullscreen ? 'Esci da schermo intero' : 'Schermo intero';
            if (chartInstance) chartInstance.resize();
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            const theme = isDarkTheme() ? 'light' : 'dark';
            document.documentElement.dataset.theme = theme;
            const button = document.getElementById('theme-toggle');
            button.setAttribute('aria-label', `Attiva tema ${theme === 'dark' ? 'chiaro' : 'scuro'}`);
            try {
                localStorage.setItem('tracker-theme', theme);
            } catch (error) {
                console.error('Impossibile salvare il tema selezionato:', error);
            }
            updateChartTheme();
        });

        document.getElementById('theme-toggle').setAttribute(
            'aria-label',
            `Attiva tema ${isDarkTheme() ? 'chiaro' : 'scuro'}`
        );
        fetchInitialData();
    </script>
</body>
</html>
