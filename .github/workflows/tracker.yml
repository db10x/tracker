name: Daily ETF Tracker

on:
  schedule:
    # Esegue lo script ogni giorno alle 18:30 UTC (circa le 19:30/20:30 italiane a seconda dell'ora legale)
    - cron: '30 18 * * 1-5'
  # Permette anche di avviarlo manualmente dalla tab "Actions" di GitHub
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python tracker.py
