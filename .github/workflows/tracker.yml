name: Daily ETF Tracker

on:

  schedule:
    # Esegue tutti i giorni della settimana alle 18:00 UTC (ogni giorno, 7 giorni su 7)
    - cron: '0 18 * * *'
  workflow_dispatch: # Mantiene la possibilità di avviarlo manualmente quando vuoi

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python tracker.py
