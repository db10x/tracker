<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Hammer.js richiesto dal plugin Zoom per il pan tramite trascinamento -->
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <!-- Plugin Zoom per Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>
    <!-- Libreria ufficiale Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        try {
            document.documentElement.dataset.theme = localStorage.getItem('tracker-theme') === 'dark'
                ? 'dark'
                : 'light';
        } catch (error) {
            console.error('Impossibile leggere il tema salvato:', error);
            document.documentElement.dataset.theme = 'light';
        }
    </script>
    <style>
        :root {
            color-scheme: light;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
        }

        :root[data-theme="dark"] body {
            background-color: #111827;
            color: #f3f4f6;
        }

        :root[data-theme="dark"] .bg-white {
            background-color: #1f2937;
        }

        :root[data-theme="dark"] .bg-gray-50 {
            background-color: #111827;
        }

        :root[data-theme="dark"] .bg-gray-100 {
            background-color: #374151;
        }

        :root[data-theme="dark"] .hover\:bg-gray-200:hover {
            background-color: #4b5563;
        }

        :root[data-theme="dark"] .hover\:bg-gray-50:hover {
            background-color: #374151;
        }

        :root[data-theme="dark"] .text-gray-900 {
            color: #f9fafb;
        }

        :root[data-theme="dark"] .text-gray-800 {
            color: #f3f4f6;
        }

        :root[data-theme="dark"] .text-gray-700 {
            color: #e5e7eb;
        }

        :root[data-theme="dark"] .text-gray-600,
        :root[data-theme="dark"] .hover\:text-gray-600:hover {
            color: #d1d5db;
        }

        :root[data-theme="dark"] .text-gray-500,
        :root[data-theme="dark"] .text-gray-400 {
            color: #9ca3af;
        }

        :root[data-theme="dark"] .text-green-600 {
            color: #4ade80;
        }

        :root[data-theme="dark"] .text-red-600 {
            color: #f87171;
        }

        :root[data-theme="dark"] .text-blue-600 {
            color: #60a5fa;
        }

        :root[data-theme="dark"] .text-blue-700 {
            color: #bfdbfe;
        }

        :root[data-theme="dark"] .bg-blue-100 {
            background-color: #1e3a8a;
        }

        :root[data-theme="dark"] .border-gray-100,
        :root[data-theme="dark"] .divide-gray-100 > :not([hidden]) ~ :not([hidden]) {
            border-color: #374151;
        }

        :root[data-theme="dark"] .border-gray-200 {
            border-color: #4b5563;
        }

        .theme-toggle:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 2px;
        }

        #chart-canvas-container {
            height: 390px;
            position: relative;
        }

        #dividend-tooltip {
            pointer-events: none;
            position: absolute;
            z-index: 10;
            white-space: nowrap;
        }

        #chart-section:fullscreen {
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            overflow: auto;
            border-radius: 0;
        }

        #chart-section:fullscreen #chart-canvas-container {
            flex: 1;
            height: auto;
            min-height: 0;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="max-w-4xl mx-auto p-6">
        <header class="mb-8 text-center">
            <div class="flex justify-end mb-2">
                <button id="toggle-theme" type="button" aria-pressed="false"
                    class="theme-toggle text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg transition-colors font-medium">
                    Tema scuro
                </button>
            </div>
            <h1 class="text-3xl font-bold text-blue-600">Tracker titoli</h1>
            <p class="text-gray-500 mt-2">Storico dei prezzi di chiusura dei titoli monitorati</p>
        </header>

        <div class="mb-4 flex flex-wrap items-center gap-3">
            <label for="portfolio-select" class="text-sm font-medium text-gray-600">Portafoglio</label>
            <select id="portfolio-select"
                class="rounded-lg border border-gray-200 bg-white px-3 py-2 text-sm text-gray-800 shadow-sm">
            </select>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-8">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-gray-400 text-xs uppercase tracking-wider">
                            <th class="py-2 px-6 font-semibold" aria-sort="ascending">
                                <button type="button" data-summary-sort="ticker" class="hover:text-gray-600">Ticker</button>
                            </th>
                            <th class="py-2 px-6 font-semibold" aria-sort="none">
                                <button type="button" data-summary-sort="description" class="hover:text-gray-600">Descrizione</button>
                            </th>
                            <th class="py-2 px-6 font-semibold text-right" aria-sort="none">
                                <button type="button" data-summary-sort="quantity" class="hover:text-gray-600">Quantità</button>
                            </th>
                            <th class="py-2 px-6 font-semibold text-right" aria-sort="none">
                                <button type="button" data-summary-sort="price" class="hover:text-gray-600">Ultimo prezzo</button>
                            </th>
                            <th class="py-2 px-6 font-semibold text-right" aria-sort="none">
                                <button type="button" data-summary-sort="variation" class="hover:text-gray-600">Variazione %</button>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="ticker-summary-body" class="divide-y divide-gray-100 text-sm">
                        <!-- I dati verranno inseriti qui da JavaScript -->
                    </tbody>
                </table>
            </div>
            <p id="load-status" class="hidden px-6 py-3 text-sm text-red-600" role="status" aria-live="polite"></p>
        </div>

        <!-- Sezione Grafico -->
        <div id="chart-section" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8 relative">
            <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
                <div class="flex flex-wrap items-center gap-2">
                    <button type="button" data-range="1m" aria-pressed="false"
                        class="range-button text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg transition-colors font-medium">
                        1M
                    </button>
                    <button type="button" data-range="1y" aria-pressed="false"
                        class="range-button text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg transition-colors font-medium">
                        1Y
                    </button>
                    <button type="button" data-range="ytd" aria-pressed="false"
                        class="range-button text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg transition-colors font-medium">
                        YTD
                    </button>
                    <button type="button" data-range="all" aria-pressed="false"
                        class="range-button text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg transition-colors font-medium">
                        Tutto
                    </button>
                </div>
                <div class="flex items-center gap-2">
                    <button id="toggle-chart-mode" type="button" aria-pressed="false"
                        class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg transition-colors font-medium">
                        Percentuale
                    </button>
                    <button id="toggle-fullscreen" type="button" aria-pressed="false"
                        class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg transition-colors font-medium">
                        Schermo intero
                    </button>
                </div>
            </div>
            <div class="flex flex-wrap items-baseline gap-2 mb-3 text-xs" aria-live="polite">
                <span class="text-gray-500">Variazione nel periodo:</span>
                <div id="chart-variation" class="flex flex-wrap gap-x-4 gap-y-1"></div>
            </div>
            <p class="mb-2 text-xs text-gray-500">Il marcatore “D” indica un dividendo; passa il puntatore per vedere l'importo per azione.</p>
            <div id="chart-canvas-container">
                <canvas id="priceChart" width="400" height="150"></canvas>
                <div id="dividend-tooltip" class="hidden rounded-lg bg-gray-900 px-3 py-2 text-xs text-white shadow-lg"
                    role="tooltip"></div>
            </div>
            <p id="fullscreen-status" class="sr-only" role="status" aria-live="polite"></p>
        </div>

    </div>

    <script>
        // --- CONFIGURAZIONE SUPABASE ---
        const SUPABASE_URL = 'https://wbwwjwfhgvrwtoaitleh.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_mMYcQfDTg7ziPFS_Nrb5PA_4I8KVBet';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let chartInstance = null; // Riferimento globale al grafico per gestire il reset
        let updateVisibleVariations = () => {};
        let percentageMode = false;
        let priceRecords = [];
        let descriptionsByTicker = new Map();
        let activePortfolioId = '';
        let activePortfolioQuantities = new Map();
        let portfolioRequestId = 0;
        let summarySortState = { key: 'ticker', direction: 'asc' };

        function isDarkTheme() {
            return document.documentElement.dataset.theme === 'dark';
        }

        function getSeriesColor(index) {
            const hue = (index * 137.508) % 360;
            const lightness = isDarkTheme() ? 65 : 45;
            return `hsl(${hue.toFixed(1)}, 78%, ${lightness}%)`;
        }

        function updateThemeButton() {
            const darkTheme = isDarkTheme();
            const themeButton = document.getElementById('toggle-theme');
            themeButton.textContent = darkTheme ? 'Tema chiaro' : 'Tema scuro';
            themeButton.setAttribute('aria-label', `Attiva tema ${darkTheme ? 'chiaro' : 'scuro'}`);
            themeButton.setAttribute('aria-pressed', String(darkTheme));
        }

        function updateChartTheme() {
            if (!chartInstance) {
                return;
            }

            const darkTheme = isDarkTheme();
            const textColor = darkTheme ? '#d1d5db' : '#666';
            chartInstance.options.plugins.legend.labels.color = textColor;
            chartInstance.options.scales.x.ticks.color = textColor;
            chartInstance.options.scales.y.ticks.color = textColor;
            chartInstance.options.scales.y.grid.color = darkTheme ? '#374151' : '#f3f4f6';
            chartInstance.data.datasets.forEach((dataset, index) => {
                const color = getSeriesColor(index);
                dataset.borderColor = color;
                dataset.backgroundColor = color;
            });
            chartInstance.update('none');
        }

        const themeButton = document.getElementById('toggle-theme');
        updateThemeButton();
        themeButton.addEventListener('click', () => {
            const theme = isDarkTheme() ? 'light' : 'dark';
            document.documentElement.dataset.theme = theme;
            updateThemeButton();
            updateChartTheme();
            try {
                localStorage.setItem('tracker-theme', theme);
            } catch (error) {
                console.error('Impossibile salvare il tema selezionato:', error);
            }
        });

        async function fetchData() {
            const { data: instruments, error: instrumentsError } = await supabaseClient
                .from('instruments')
                .select('ticker, description');

            if (instrumentsError) {
                console.error('Errore nel recupero delle descrizioni:', instrumentsError);
                showLoadError('Errore nel caricamento delle descrizioni.');
                return;
            }

            descriptionsByTicker = new Map(
                instruments.map(instrument => [instrument.ticker, instrument.description || ''])
            );
            const { data: portfolios, error: portfoliosError } = await supabaseClient
                .from('portfolios')
                .select('id, name')
                .order('name', { ascending: true });

            if (portfoliosError) {
                console.error('Errore nel recupero dei portafogli:', portfoliosError);
                showLoadError('Errore nel caricamento dei portafogli.');
                return;
            }

            const portfolioSelect = document.getElementById('portfolio-select');
            if (portfolios.length === 0) {
                portfolioSelect.disabled = true;
                renderUI([]);
                showLoadError('Non ci sono portafogli nel database. Creane uno per visualizzare i ticker.');
                return;
            }

            portfolios.forEach(portfolio => {
                const option = document.createElement('option');
                option.value = portfolio.id;
                option.textContent = portfolio.name;
                portfolioSelect.appendChild(option);
            });
            portfolioSelect.addEventListener('change', handlePortfolioChange);
            portfolioSelect.value = portfolios[0].id;
            await handlePortfolioChange({ target: portfolioSelect });
        }

        async function fetchPricesForTickers(tickers) {
            let allPrices = [];
            let page = 0;
            const pageSize = 1000;
            let keepFetching = true;

            while (keepFetching) {
                const from = page * pageSize;
                const to = from + pageSize - 1;
                const { data, error } = await supabaseClient
                    .from('prices')
                    .select('*')
                    .in('ticker', tickers)
                    .order('ticker', { ascending: true })
                    .order('date', { ascending: false })
                    .range(from, to);

                if (error) {
                    console.error('Errore nel recupero dei prezzi del portafoglio:', error);
                    return null;
                }

                allPrices = allPrices.concat(data);
                keepFetching = data.length === pageSize;
                page++;
            }

            return allPrices.map(record => ({
                ...record,
                description: descriptionsByTicker.get(record.ticker) || ''
            }));
        }

        async function fetchDividendsForTickers(tickers) {
            let allDividends = [];
            let page = 0;
            const pageSize = 1000;
            let keepFetching = true;

            while (keepFetching) {
                const from = page * pageSize;
                const to = from + pageSize - 1;
                const { data, error } = await supabaseClient
                    .from('dividends')
                    .select('date, ticker, amount')
                    .in('ticker', tickers)
                    .order('date', { ascending: false })
                    .order('ticker', { ascending: true })
                    .range(from, to);

                if (error) {
                    console.error('Errore nel recupero dei dividendi del portafoglio:', error);
                    return null;
                }

                allDividends = allDividends.concat(data);
                keepFetching = data.length === pageSize;
                page++;
            }

            return allDividends;
        }

        function showLoadError(message) {
            const status = document.getElementById('load-status');
            status.textContent = message;
            status.classList.remove('hidden');
        }

        function renderUI(data, quantityByTicker = new Map(), dividends = []) {
            priceRecords = data;
            activePortfolioQuantities = quantityByTicker;
            renderTickerSummary(data, quantityByTicker);

            if (data.length === 0) {
                if (chartInstance) {
                    chartInstance.destroy();
                    chartInstance = null;
                }
                document.querySelectorAll('[data-range], #toggle-chart-mode').forEach(button => {
                    button.disabled = true;
                });
                document.getElementById('chart-variation').replaceChildren();
                document.getElementById('dividend-tooltip').classList.add('hidden');
                return;
            }

            document.querySelectorAll('[data-range], #toggle-chart-mode').forEach(button => {
                button.disabled = false;
            });
            const recordedDates = [...new Set(data.map(row => row.date))].sort();
            const firstDateParts = recordedDates[0].split('-').map(Number);
            const lastDateParts = recordedDates[recordedDates.length - 1].split('-').map(Number);
            const currentDate = new Date(Date.UTC(
                firstDateParts[0],
                firstDateParts[1] - 1,
                firstDateParts[2]
            ));
            const lastDate = Date.UTC(
                lastDateParts[0],
                lastDateParts[1] - 1,
                lastDateParts[2]
            );
            const dates = [];
            while (currentDate.getTime() <= lastDate) {
                dates.push(currentDate.toISOString().slice(0, 10));
                currentDate.setUTCDate(currentDate.getUTCDate() + 1);
            }
            const tickers = [...new Set(data.map(row => row.ticker))].sort();
            const pricesByTicker = new Map(
                tickers.map(ticker => [ticker, new Map()])
            );
            data.forEach(row => {
                pricesByTicker.get(row.ticker).set(row.date, Number(row.price));
            });
            const datasets = tickers.map((ticker, index) => {
                const color = getSeriesColor(index);
                const values = dates.map(date => pricesByTicker.get(ticker).get(date) ?? null);
                return {
                    label: ticker,
                    data: values,
                    rawData: values,
                    hidden: index !== 0,
                    spanGaps: true,
                    borderColor: color,
                    backgroundColor: color,
                    borderWidth: 2,
                    fill: false,
                    tension: 0.1,
                    pointRadius: 0,
                    pointHitRadius: 12,
                    pointHoverRadius: 5
                };
            });

            renderChart(dates, datasets, dividends);
        }

        function renderTickerSummary(data, quantityByTicker = new Map()) {
            const tbody = document.getElementById('ticker-summary-body');
            tbody.replaceChildren();
            document.getElementById('load-status').classList.add('hidden');

            if (data.length === 0 && quantityByTicker.size === 0) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 5;
                cell.className = 'py-1 px-6 text-center text-gray-400';
                cell.textContent = activePortfolioId
                    ? 'Nessun ticker presente nel portafoglio selezionato.'
                    : 'Nessun dato presente nel database.';
                row.appendChild(cell);
                tbody.appendChild(row);
                return;
            }

            const recordsByTicker = new Map();
            data.forEach(record => {
                if (!recordsByTicker.has(record.ticker)) {
                    recordsByTicker.set(record.ticker, []);
                }
                recordsByTicker.get(record.ticker).push(record);
            });

            const summaries = [...recordsByTicker.entries()].map(([ticker, records]) => {
                records.sort((recordA, recordB) => recordB.date.localeCompare(recordA.date));
                const latestPrice = Number(records[0].price);
                const previousPrice = records.length > 1 ? Number(records[1].price) : null;
                const hasVariation = previousPrice !== null
                    && Number.isFinite(latestPrice)
                    && Number.isFinite(previousPrice)
                    && previousPrice !== 0;
                const variation = hasVariation
                    ? ((latestPrice - previousPrice) / previousPrice) * 100
                    : null;
                return {
                    ticker,
                    description: records[0].description || '',
                    quantity: quantityByTicker.has(ticker) ? Number(quantityByTicker.get(ticker)) : null,
                    price: latestPrice,
                    variation
                };
            });
            quantityByTicker.forEach((quantity, ticker) => {
                if (!recordsByTicker.has(ticker)) {
                    summaries.push({
                        ticker,
                        description: '',
                        quantity: Number(quantity),
                        price: null,
                        variation: null
                    });
                }
            });
            const direction = summarySortState.direction === 'asc' ? 1 : -1;
            summaries.sort((summaryA, summaryB) => {
                const valueA = summaryA[summarySortState.key];
                const valueB = summaryB[summarySortState.key];
                let comparison;
                if (summarySortState.key === 'price' || summarySortState.key === 'variation'
                    || summarySortState.key === 'quantity') {
                    const finiteA = Number.isFinite(valueA);
                    const finiteB = Number.isFinite(valueB);
                    comparison = finiteA && finiteB
                        ? valueA - valueB
                        : finiteA ? -1 : finiteB ? 1 : 0;
                } else {
                    comparison = String(valueA).localeCompare(String(valueB), 'it');
                }
                return comparison * direction;
            });

            summaries.forEach(({ ticker, description, quantity, price, variation }) => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-gray-50 transition-colors';

                const tickerCell = document.createElement('td');
                tickerCell.className = 'py-1 px-6 font-medium text-gray-900';
                tickerCell.textContent = ticker;

                const descriptionCell = document.createElement('td');
                descriptionCell.className = 'py-1 px-6 text-gray-500';
                descriptionCell.textContent = description;

                const quantityCell = document.createElement('td');
                quantityCell.className = 'py-1 px-6 text-right text-gray-600';
                quantityCell.textContent = Number.isFinite(quantity)
                    ? quantity.toLocaleString('it-IT', { maximumFractionDigits: 8 })
                    : '—';

                const priceCell = document.createElement('td');
                priceCell.className = 'py-1 px-6 text-right font-semibold text-blue-600';
                priceCell.textContent = Number.isFinite(price)
                    ? `${price.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`
                    : '—';

                const variationCell = document.createElement('td');
                variationCell.className = 'py-1 px-6 text-right font-semibold';
                if (variation === null || !Number.isFinite(variation)) {
                    variationCell.classList.add('text-gray-400');
                    variationCell.textContent = '—';
                } else {
                    variationCell.classList.add(
                        variation > 0 ? 'text-green-600' : variation < 0 ? 'text-red-600' : 'text-gray-500'
                    );
                    const sign = variation >= 0 ? '+' : '';
                    variationCell.textContent = `${sign}${variation.toLocaleString('it-IT', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    })}%`;
                }

                row.append(tickerCell, descriptionCell, quantityCell, priceCell, variationCell);
                tbody.appendChild(row);
            });
        }

        async function handlePortfolioChange(event) {
            const portfolioId = event.target.value;
            const requestId = ++portfolioRequestId;
            if (!portfolioId) {
                return;
            }

            let allPositions = [];
            let page = 0;
            const pageSize = 1000;
            let keepFetching = true;
            while (keepFetching) {
                const from = page * pageSize;
                const to = from + pageSize - 1;
                const { data, error } = await supabaseClient
                    .from('portfolio_positions')
                    .select('ticker, quantity')
                    .eq('portfolio_id', portfolioId)
                    .order('ticker', { ascending: true })
                    .range(from, to);

                if (error) {
                    if (requestId !== portfolioRequestId) {
                        return;
                    }
                    console.error('Errore nel recupero delle posizioni del portafoglio:', error);
                    showLoadError('Errore nel caricamento delle posizioni del portafoglio.');
                    event.target.value = activePortfolioId || portfolioId;
                    return;
                }

                if (requestId !== portfolioRequestId) {
                    return;
                }
                allPositions = allPositions.concat(data);
                keepFetching = data.length === pageSize;
                page++;
            }

            const quantityByTicker = new Map(
                allPositions.map(position => [position.ticker, Number(position.quantity)])
            );
            if (quantityByTicker.size === 0) {
                activePortfolioId = portfolioId;
                renderUI([], quantityByTicker);
                return;
            }

            const tickers = [...quantityByTicker.keys()];
            const [portfolioPrices, portfolioDividends] = await Promise.all([
                fetchPricesForTickers(tickers),
                fetchDividendsForTickers(tickers)
            ]);
            if (requestId !== portfolioRequestId) {
                return;
            }
            if (portfolioPrices === null || portfolioDividends === null) {
                showLoadError('Errore nel caricamento dei prezzi o dei dividendi del portafoglio.');
                event.target.value = activePortfolioId || portfolioId;
                return;
            }
            activePortfolioId = portfolioId;
            renderUI(portfolioPrices, quantityByTicker, portfolioDividends);
        }

        document.querySelectorAll('[data-summary-sort]').forEach(button => {
            button.addEventListener('click', () => {
                const key = button.dataset.summarySort;
                const direction = summarySortState.key === key
                    && summarySortState.direction === 'asc'
                    ? 'desc'
                    : 'asc';
                summarySortState = { key, direction };
                document.querySelectorAll('[data-summary-sort]').forEach(sortButton => {
                    const header = sortButton.closest('th');
                    header.setAttribute('aria-sort', sortButton.dataset.summarySort === key
                        ? (direction === 'asc' ? 'ascending' : 'descending')
                        : 'none');
                });
                renderTickerSummary(priceRecords, activePortfolioQuantities);
            });
        });

        function renderChart(labels, datasets, dividends) {
            const ctx = document.getElementById('priceChart').getContext('2d');
            const chartModeButton = document.getElementById('toggle-chart-mode');
            const dividendTooltip = document.getElementById('dividend-tooltip');
            const container = document.getElementById('chart-canvas-container');
            const datasetIndexesByTicker = new Map(
                datasets.map((dataset, index) => [dataset.label, index])
            );
            const dividendEvents = dividends
                .map(dividend => ({
                    ...dividend,
                    amount: Number(dividend.amount),
                    dateIndex: labels.indexOf(dividend.date)
                }))
                .filter(dividend => dividend.dateIndex >= 0);
            const markerRadius = 7;
            let hoveredDividend = null;
            const hideDividendTooltip = () => {
                if (!dividendTooltip.classList.contains('hidden')) {
                    dividendTooltip.classList.add('hidden');
                    hoveredDividend = null;
                    return true;
                }
                return false;
            };
            const dividendMarkerPlugin = {
                id: 'dividendMarkers',
                afterDatasetsDraw: chart => {
                    const { ctx: chartContext, chartArea, scales } = chart;
                    chartContext.save();
                    dividendEvents.forEach(dividend => {
                        const datasetIndex = datasetIndexesByTicker.get(dividend.ticker);
                        if (datasetIndex === undefined || !chart.isDatasetVisible(datasetIndex)
                            || dividend.dateIndex < scales.x.min
                            || dividend.dateIndex > scales.x.max) {
                            return;
                        }

                        const x = scales.x.getPixelForValue(dividend.dateIndex);
                        if (x < chartArea.left || x > chartArea.right) {
                            return;
                        }
                        const y = chartArea.bottom - markerRadius - 2;
                        const color = chart.data.datasets[datasetIndex].borderColor;
                        chartContext.beginPath();
                        chartContext.arc(x, y, markerRadius, 0, Math.PI * 2);
                        chartContext.fillStyle = color;
                        chartContext.fill();
                        chartContext.fillStyle = '#ffffff';
                        chartContext.font = 'bold 9px sans-serif';
                        chartContext.textAlign = 'center';
                        chartContext.textBaseline = 'middle';
                        chartContext.fillText('D', x, y);
                    });
                    chartContext.restore();
                },
                afterEvent: (chart, args) => {
                    const { event } = args;
                    if (event.type === 'mouseout') {
                        if (hideDividendTooltip()) {
                            args.changed = true;
                        }
                        return;
                    }

                    const { chartArea, scales } = chart;
                    let match = null;
                    if (event.x >= chartArea.left && event.x <= chartArea.right
                        && event.y >= chartArea.top && event.y <= chartArea.bottom) {
                        match = dividendEvents.find(dividend => {
                            const datasetIndex = datasetIndexesByTicker.get(dividend.ticker);
                            if (datasetIndex === undefined || !chart.isDatasetVisible(datasetIndex)
                                || dividend.dateIndex < scales.x.min
                                || dividend.dateIndex > scales.x.max) {
                                return false;
                            }
                            const x = scales.x.getPixelForValue(dividend.dateIndex);
                            const y = chartArea.bottom - markerRadius - 2;
                            return Math.hypot(event.x - x, event.y - y) <= markerRadius + 5;
                        }) || null;
                    }

                    if (!match) {
                        if (hideDividendTooltip()) {
                            args.changed = true;
                        }
                        return;
                    }

                    if (hoveredDividend === match) {
                        return;
                    }

                    hoveredDividend = match;
                    const dateLine = document.createElement('span');
                    dateLine.className = 'block';
                    dateLine.textContent = match.date;
                    const amountLine = document.createElement('span');
                    amountLine.className = 'block';
                    amountLine.textContent = `${match.ticker}: ${
                        match.amount.toLocaleString('it-IT', {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        })
                    } €`;
                    dividendTooltip.replaceChildren(dateLine, amountLine);
                    dividendTooltip.classList.remove('hidden');
                    const left = Math.min(
                        event.x + 10,
                        container.clientWidth - dividendTooltip.offsetWidth - 8
                    );
                    dividendTooltip.style.left = `${Math.max(8, left)}px`;
                    dividendTooltip.style.top = `${
                        Math.max(0, event.y - dividendTooltip.offsetHeight - 8)
                    }px`;
                    args.changed = true;
                }
            };
            const getVisibleDataRange = (chartDatasets, isVisible = dataset => !dataset.hidden) => {
                let firstIndex = Infinity;
                let lastIndex = -Infinity;

                chartDatasets.forEach((dataset, datasetIndex) => {
                    if (!isVisible(dataset, datasetIndex)) {
                        return;
                    }
                    dataset.data.forEach((price, index) => {
                        if (Number.isFinite(price)) {
                            firstIndex = Math.min(firstIndex, index);
                            lastIndex = Math.max(lastIndex, index);
                        }
                    });
                });

                return firstIndex === Infinity ? null : { min: firstIndex, max: lastIndex };
            };
            
            if (chartInstance) {
                chartInstance.destroy();
            }
            hideDividendTooltip();

            const getInterpolatedValue = (values, position) => {
                let previousIndex = -1;
                let nextIndex = -1;
                for (let index = Math.min(Math.floor(position), values.length - 1); index >= 0; index--) {
                    if (Number.isFinite(values[index])) {
                        previousIndex = index;
                        break;
                    }
                }
                for (let index = Math.max(0, Math.ceil(position)); index < values.length; index++) {
                    if (Number.isFinite(values[index])) {
                        nextIndex = index;
                        break;
                    }
                }

                if (previousIndex >= 0 && previousIndex === nextIndex) {
                    return values[previousIndex];
                }
                if (previousIndex >= 0 && nextIndex >= 0) {
                    const progress = (position - previousIndex) / (nextIndex - previousIndex);
                    return values[previousIndex]
                        + (values[nextIndex] - values[previousIndex]) * progress;
                }
                if (nextIndex >= 0) {
                    return values[nextIndex];
                }
                return previousIndex >= 0 ? values[previousIndex] : null;
            };

            const updatePercentageDatasets = chart => {
                if (!percentageMode) {
                    chart.data.datasets.forEach(dataset => {
                        dataset.data = dataset.rawData;
                    });
                    return;
                }

                const visibleStart = Math.max(0, chart.scales.x.min);
                chart.data.datasets.forEach(dataset => {
                    const baseline = getInterpolatedValue(dataset.rawData, visibleStart);
                    dataset.data = dataset.rawData.map(value =>
                        Number.isFinite(value) && baseline !== null && baseline !== 0
                            ? ((value - baseline) / baseline) * 100
                            : null
                    );
                });
            };

            updateVisibleVariations = chart => {
                const variationContainer = document.getElementById('chart-variation');
                const firstIndex = Math.max(0, Math.ceil(chart.scales.x.min));
                const lastIndex = Math.min(chart.data.labels.length - 1, Math.floor(chart.scales.x.max));
                variationContainer.replaceChildren();

                chart.data.datasets.forEach((dataset, datasetIndex) => {
                    if (!chart.isDatasetVisible(datasetIndex)) {
                        return;
                    }

                    let firstPrice = null;
                    let lastPrice = null;
                    let visiblePriceCount = 0;
                    for (let index = firstIndex; index <= lastIndex; index++) {
                        const price = dataset.data[index];
                        if (Number.isFinite(price)) {
                            visiblePriceCount++;
                            if (firstPrice === null) {
                                firstPrice = price;
                            }
                            lastPrice = price;
                        }
                    }

                    const item = document.createElement('span');
                    item.className = 'font-semibold';
                    if (visiblePriceCount < 2 || firstPrice === null || lastPrice === null
                        || (!percentageMode && firstPrice === 0)) {
                        item.classList.add('text-gray-400');
                        item.textContent = `${dataset.label}: —`;
                    } else {
                        const variation = percentageMode
                            ? getInterpolatedValue(dataset.data, chart.scales.x.max) ?? lastPrice
                            : ((lastPrice - firstPrice) / firstPrice) * 100;
                        item.classList.add(
                            variation > 0 ? 'text-green-600' : variation < 0 ? 'text-red-600' : 'text-gray-500'
                        );
                        const sign = variation >= 0 ? '+' : '';
                        item.textContent = `${dataset.label}: ${sign}${variation.toLocaleString('it-IT', {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        })}%`;
                    }
                    variationContainer.appendChild(item);
                });
            };

            const updateRangeButtons = activeRange => {
                document.querySelectorAll('[data-range]').forEach(button => {
                    const isActive = button.dataset.range === activeRange;
                    button.setAttribute('aria-pressed', String(isActive));
                    button.classList.toggle('bg-blue-100', isActive);
                    button.classList.toggle('text-blue-700', isActive);
                    button.classList.toggle('bg-gray-100', !isActive);
                    button.classList.toggle('text-gray-600', !isActive);
                });
            };

            let tickCacheKey = '';
            let xAxisTickLabels = new Map();
            const monthFormatter = new Intl.DateTimeFormat('it-IT', { month: 'short' });
            const getXAxisTickLabels = scale => {
                const cacheKey = `${scale.min}:${scale.max}:${scale.width}`;
                if (cacheKey === tickCacheKey) {
                    return xAxisTickLabels;
                }

                tickCacheKey = cacheKey;
                xAxisTickLabels = new Map();
                const firstVisibleIndex = Math.max(0, Math.ceil(scale.min));
                const lastVisibleIndex = Math.min(labels.length - 1, Math.floor(scale.max));
                if (firstVisibleIndex > lastVisibleIndex) {
                    return xAxisTickLabels;
                }

                const visibleDays = scale.max - scale.min;
                const startParts = labels[firstVisibleIndex].split('-').map(Number);
                const endParts = labels[lastVisibleIndex].split('-').map(Number);
                const visibleMonths = (endParts[0] - startParts[0]) * 12
                    + endParts[1] - startParts[1] + 1;
                const isWideView = visibleDays > 120;
                const maxMonthLabels = Math.max(2, Math.floor(scale.width / 55));
                const monthInterval = Math.ceil(visibleMonths / maxMonthLabels);
                const monthCandidates = [];

                for (let index = firstVisibleIndex; index <= lastVisibleIndex; index++) {
                    const [year, month, day] = labels[index].split('-').map(Number);
                    const previousDate = index > 0
                        ? labels[index - 1].split('-').map(Number)
                        : null;
                    const isMonthStart = day === 1 || !previousDate
                        || previousDate[0] !== year
                        || previousDate[1] !== month;
                    if (isMonthStart) {
                        const monthIndex = (year - startParts[0]) * 12 + month - startParts[1];
                        if (month === 1 || !isWideView || monthIndex % monthInterval === 0) {
                            const text = month === 1
                                ? String(year)
                                : monthFormatter.format(new Date(year, month - 1, day));
                            monthCandidates.push({
                                index,
                                text,
                                priority: month === 1 ? 3 : 2,
                                x: scale.getPixelForValue(index),
                                width: text.length * 7 + 8
                            });
                        }
                    }
                }

                const accepted = [];
                monthCandidates.sort((a, b) => b.priority - a.priority || a.x - b.x)
                    .forEach(candidate => {
                        const hasCollision = accepted.some(label =>
                            Math.abs(candidate.x - label.x) < (candidate.width + label.width) / 2 + 4
                        );
                        if (!hasCollision) {
                            accepted.push(candidate);
                            xAxisTickLabels.set(candidate.index, candidate.text);
                        }
                    });

                if (!isWideView) {
                    const dayCandidates = [];
                    for (let index = firstVisibleIndex; index <= lastVisibleIndex; index++) {
                        const [year, month, day] = labels[index].split('-').map(Number);
                        const previousDate = index > 0
                            ? labels[index - 1].split('-').map(Number)
                            : null;
                        const isMonthStart = day === 1 || !previousDate
                            || previousDate[0] !== year
                            || previousDate[1] !== month;
                        if (!isMonthStart) {
                            dayCandidates.push({
                                index,
                                text: String(day),
                                x: scale.getPixelForValue(index),
                                width: String(day).length * 7 + 8
                            });
                        }
                    }

                    const anchors = [
                        { x: scale.left, width: 0, edge: true },
                        ...accepted.sort((a, b) => a.x - b.x),
                        { x: scale.right, width: 0, edge: true }
                    ];
                    const targetSpacing = 55;

                    for (let anchorIndex = 0; anchorIndex < anchors.length - 1; anchorIndex++) {
                        const leftAnchor = anchors[anchorIndex];
                        const rightAnchor = anchors[anchorIndex + 1];
                        const segmentStart = leftAnchor.edge
                            ? leftAnchor.x + 10
                            : leftAnchor.x + leftAnchor.width / 2 + 6;
                        const segmentEnd = rightAnchor.edge
                            ? rightAnchor.x - 10
                            : rightAnchor.x - rightAnchor.width / 2 - 6;
                        const segmentWidth = segmentEnd - segmentStart;
                        const slotCount = Math.max(
                            0,
                            Math.round((rightAnchor.x - leftAnchor.x) / targetSpacing) - 1
                        );

                        for (let slot = 1; slot <= slotCount; slot++) {
                            const targetX = segmentStart + segmentWidth * slot / (slotCount + 1);
                            const nearbyCandidates = dayCandidates
                                .filter(candidate => Math.abs(candidate.x - targetX) <= targetSpacing)
                                .sort((a, b) => Math.abs(a.x - targetX) - Math.abs(b.x - targetX));
                            const candidate = nearbyCandidates.find(day =>
                                !accepted.some(label =>
                                    Math.abs(day.x - label.x) < (day.width + label.width) / 2 + 4
                                )
                            );

                            if (candidate) {
                                accepted.push(candidate);
                                xAxisTickLabels.set(candidate.index, candidate.text);
                            }
                        }
                    }
                }

                return xAxisTickLabels;
            };

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                color: isDarkTheme() ? '#d1d5db' : '#666',
                                usePointStyle: true,
                                pointStyle: 'rect',
                                boxWidth: 8,
                                boxHeight: 8
                            },
                            onClick: (event, legendItem, legend) => {
                                const chart = legend.chart;
                                const datasetIndex = legendItem.datasetIndex;
                                chart.setDatasetVisibility(
                                    datasetIndex,
                                    !chart.isDatasetVisible(datasetIndex)
                                );
                                chart.update('none');
                                const isAllRangeSelected = document
                                    .querySelector('[data-range="all"]')
                                    .getAttribute('aria-pressed') === 'true';
                                if (isAllRangeSelected) {
                                    const visibleRange = getVisibleDataRange(
                                        chart.data.datasets,
                                        (_, index) => chart.isDatasetVisible(index)
                                    );
                                    if (visibleRange) {
                                        chart.zoomScale('x', visibleRange);
                                        updateRangeButtons('all');
                                    }
                                    updateVisibleVariations(chart);
                                } else {
                                    updateVisibleVariations(chart);
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: context => {
                                    const value = context.parsed.y.toLocaleString('it-IT', {
                                        minimumFractionDigits: 2,
                                        maximumFractionDigits: 2
                                    });
                                    return `${context.dataset.label}: ${value}${percentageMode ? '%' : ' €'}`;
                                }
                            }
                        },
                        zoom: {
                            pan: {
                                enabled: true,
                                mode: 'x', // Permette lo spostamento sull'asse orizzontale
                                modifierKey: null, // Permette il pan diretto con il tasto sinistro senza tenere premuto nessun tasto della tastiera
                                onPan: ({ chart }) => {
                                    updatePercentageDatasets(chart);
                                    chart.update('none');
                                    updateVisibleVariations(chart);
                                    updateRangeButtons(null);
                                }
                            },
                            zoom: {
                                wheel: {
                                    enabled: true // Zoom con la rotellina del mouse
                                },
                                pinch: {
                                    enabled: true // Zoom con due dita su smartphone
                                },
                                mode: 'x', // Zoom solo sull'asse delle date (orizzontale)
                                onZoom: ({ chart }) => {
                                    updatePercentageDatasets(chart);
                                    chart.update('none');
                                    updateVisibleVariations(chart);
                                    updateRangeButtons(null);
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            grid: { color: isDarkTheme() ? '#374151' : '#f3f4f6' },
                            ticks: {
                                color: isDarkTheme() ? '#d1d5db' : '#666',
                                callback: percentageMode
                                    ? value => `${Number(value).toLocaleString('it-IT', {
                                        maximumFractionDigits: 2
                                    })}%`
                                    : undefined
                            }
                        },
                        x: {
                            ...getVisibleDataRange(datasets),
                            grid: {
                                display: false,
                                drawTicks: false
                            },
                            ticks: {
                                color: isDarkTheme() ? '#d1d5db' : '#666',
                                autoSkip: false,
                                maxRotation: 0,
                                minRotation: 0,
                                callback: function(value) {
                                    const index = Math.round(Number(value));
                                    return getXAxisTickLabels(this).get(index) ?? '';
                                }
                            }
                        }
                    }
                },
                plugins: [dividendMarkerPlugin]
            });
            chartInstance.data.datasets.forEach(dataset => {
                dataset.tension = percentageMode ? 0 : 0.1;
            });
            updateRangeButtons('all');
            chartModeButton.textContent = percentageMode ? 'Valori assoluti' : 'Percentuale';
            chartModeButton.setAttribute('aria-pressed', String(percentageMode));
            updateVisibleVariations(chartInstance);

            chartModeButton.onclick = () => {
                percentageMode = !percentageMode;
                chartInstance.data.datasets.forEach(dataset => {
                    dataset.tension = percentageMode ? 0 : 0.1;
                });
                updatePercentageDatasets(chartInstance);
                chartInstance.options.scales.y.ticks.callback = percentageMode
                    ? value => `${Number(value).toLocaleString('it-IT', {
                        maximumFractionDigits: 2
                    })}%`
                    : undefined;
                chartModeButton.textContent = percentageMode ? 'Valori assoluti' : 'Percentuale';
                chartModeButton.setAttribute('aria-pressed', String(percentageMode));
                chartInstance.update('none');
                updateVisibleVariations(chartInstance);
            };

            document.querySelectorAll('[data-range]').forEach(button => {
                button.addEventListener('click', () => {
                    const range = button.dataset.range;
                    const lastIndex = labels.length - 1;
                    let startIndex;

                    if (range === '1m') {
                        startIndex = Math.max(0, lastIndex - 29);
                    } else if (range === '1y') {
                        startIndex = Math.max(0, lastIndex - 364);
                    } else if (range === 'ytd') {
                        const lastDate = labels[lastIndex];
                        const yearStart = `${lastDate.slice(0, 4)}-01-01`;
                        const previousYearRecords = priceRecords
                            .filter(record => record.date < yearStart)
                            .sort((recordA, recordB) => recordB.date.localeCompare(recordA.date));
                        const ytdStartDate = previousYearRecords.length > 0
                            ? previousYearRecords[0].date
                            : yearStart;
                        startIndex = Math.max(0, labels.indexOf(ytdStartDate));
                    } else {
                        const visibleRange = getVisibleDataRange(
                            chartInstance.data.datasets,
                            (_, datasetIndex) => chartInstance.isDatasetVisible(datasetIndex)
                        );
                        if (!visibleRange) {
                            return;
                        }
                        startIndex = visibleRange.min;
                        chartInstance.zoomScale('x', visibleRange);
                        updatePercentageDatasets(chartInstance);
                        chartInstance.update('none');
                        updateRangeButtons(range);
                        updateVisibleVariations(chartInstance);
                        return;
                    }

                    chartInstance.zoomScale('x', { min: startIndex, max: lastIndex });
                    updatePercentageDatasets(chartInstance);
                    chartInstance.update('none');
                    updateRangeButtons(range);
                    updateVisibleVariations(chartInstance);
                });
            });
        }

        const chartSection = document.getElementById('chart-section');
        const fullscreenButton = document.getElementById('toggle-fullscreen');
        const fullscreenStatus = document.getElementById('fullscreen-status');

        fullscreenButton.addEventListener('click', async () => {
            try {
                if (document.fullscreenElement === chartSection) {
                    await document.exitFullscreen();
                } else {
                    await chartSection.requestFullscreen();
                }
            } catch (error) {
                console.error('Impossibile modificare la modalità a schermo intero:', error);
                fullscreenStatus.textContent = 'Non è stato possibile modificare la modalità a schermo intero.';
            }
        });

        document.addEventListener('fullscreenchange', () => {
            const isFullscreen = document.fullscreenElement === chartSection;
            fullscreenButton.textContent = isFullscreen ? 'Esci da schermo intero' : 'Schermo intero';
            fullscreenButton.setAttribute('aria-pressed', String(isFullscreen));
            fullscreenStatus.textContent = '';
            if (chartInstance) {
                chartInstance.resize();
            }
        });

        // Avvia il caricamento
        fetchData();
    </script>
</body>
</html>
